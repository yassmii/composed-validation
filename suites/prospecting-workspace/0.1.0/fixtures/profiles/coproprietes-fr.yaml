profile_id: coproprietes-fr
version: 0.1.0
status: illustrative
activation_ready: false
purpose: Identifier des copropriétés pertinentes pour une offre à définir, établir leurs interlocuteurs puis qualifier leur besoin réel.
business_owner: À désigner
target_types: [copropriete]
related_types: [syndicat_coproprietaires, immeuble, syndic, personne]
attributes:
  - {field: copropriete.identifiant_rnic, type: string, required_for: rapprochement_certain_si_disponible}
  - {field: copropriete.commune, type: string, required_for: adequation_territoriale}
  - {field: copropriete.nombre_lots_habitation, type: integer, unit: lot, required_for: adequation_taille}
  - {field: dossier.besoin_exprime, type: string, required_for: qualification_commerciale}
  - {field: dossier.role_interlocuteur_etabli, type: boolean, required_for: qualification_commerciale}
  - {field: dossier.prochaine_etape_acceptee, type: boolean, required_for: qualification_commerciale}
relations:
  - {type: represente, from: syndic, to: syndicat_coproprietaires, cardinality: plusieurs_cibles_par_syndic, validity: dates_ou_inconnue}
  - {type: concerne, from: immeuble, to: copropriete, cardinality: configurable, validity: dates_ou_inconnue}
  - {type: interlocuteur_pour, from: personne, to: copropriete, cardinality: plusieurs_a_plusieurs, validity: dates_ou_inconnue}
identity:
  reliable_key: [type, emetteur_rnic, identifiant_rnic]
  possible_match: adresse_normalisee_et_nom_avec_revue
  never_sufficient_alone: [adresse, nom_du_syndic, courriel_du_syndic]
acquisition:
  candidate_sources:
    - name: RNIC publié par ANAH
      reference: https://www.data.gouv.fr/datasets/registre-national-dimmatriculation-des-coproprietes
      access_status: non_configure
      reuse_status: licence_et_finalite_a_verifier_pour_le_traitement
      limitation: Identifier et décrire des cibles; aucune preuve de besoin ni garantie de contact décisionnaire.
    - name: Sources officielles et déclarations directes des interlocuteurs
      access_status: a_definir
      reuse_status: a_valider
  filters: [territoire_a_definir, nombre_lots_minimal_a_valider]
  inbound_form:
    fields: [identification_copropriete, role_declarant, besoin_exprime, moyen_reponse_choisi]
    marketing_consent: facultatif_distinct_de_la_demande
qualification:
  criteria:
    - criterion_id: COP-TERRITOIRE
      dimension: adequation
      rule: {field: copropriete.commune, operator: in, value: territoire_valide_de_la_campagne}
      evidence: {allowed: [registre, verification_manuelle_sourcee], max_age_days: 180}
    - criterion_id: COP-TAILLE
      dimension: adequation
      rule: {field: copropriete.nombre_lots_habitation, operator: gte, value: 20}
      evidence: {allowed: [registre, document_valide], max_age_days: 180}
      note: Seuil illustratif à valider selon l'offre; la distinction lots totaux et habitation doit être contrôlée lors du mapping.
    - criterion_id: COP-BESOIN
      dimension: interet_besoin
      rule: {field: dossier.besoin_exprime, operator: exists}
      evidence: {allowed: [declaration_directe_attribuee], scope: cette_copropriete_et_cette_offre, max_age_days: 90}
    - criterion_id: COP-ROLE
      dimension: qualite_donnees
      rule: {field: dossier.role_interlocuteur_etabli, operator: equals, value: true}
      evidence: {allowed: [mandat_documente, verification_sourcee_du_role], max_age_days: 90}
    - criterion_id: COP-SUITE
      dimension: interet_besoin
      rule: {field: dossier.prochaine_etape_acceptee, operator: equals, value: true}
      evidence: {allowed: [reponse_directe_attribuee], max_age_days: 30}
  levels:
    - {name: cible_pertinente, mandatory_criteria: [COP-TERRITOIRE, COP-TAILLE]}
    - {name: lead_commercialement_qualifie, mandatory_criteria: [COP-TERRITOIRE, COP-TAILLE, COP-BESOIN, COP-ROLE, COP-SUITE]}
  unknown_handling: bloque_le_niveau_concerne_et_propose_la_preuve_a_obtenir
  acceptance: decision_humaine_attribuee
  contactability: evaluation_separee_par_destinataire_finalite_canal_et_politique
priority:
  method: ordre_explicite_par_niveau_accepte_puis_prochaine_echeance
  forbidden_inference: Le nombre de lots, le nom du syndic ou une caractéristique immobilière ne prouvent ni budget ni travaux votés ni intention d'achat.
follow_up:
  stages: [a_examiner, a_qualifier, echange_en_cours, prochaine_etape_acceptee, conclu, ecarte]
  transition_gates: {prochaine_etape_acceptee: lead_commercialement_qualifie_accepte}
  terminal_outcomes: [transfert_accepte_vers_processus_commercial, refus, hors_cible]
  responsibility: utilisateur_ou_file_responsable_identifiee
  next_action: datee_ou_attente_motivee_avec_reexamen
contact_content:
  offer: Aucune offre fournie par la demande; à définir avant une sollicitation réelle.
  approved_claims: []
  forbidden: [inventer_un_besoin, promettre_une_aide_financiere, inventer_un_mandat, deduire_tous_les_coproprietaires_du_registre]
monitoring:
  enabled: false
  possible_changes: [mise_a_jour_caracteristiques, changement_de_relation_syndic]
  effect: proposer_un_reexamen_sans_contact_automatique
evaluation:
  baseline: revue_manuelle_avec_la_meme_grille
  cases: [plusieurs_coproprietes_meme_syndic, adresse_partagee, syndic_change, besoin_inconnu, demande_entrante, opposition_interlocuteur]
  publication_thresholds: a_fixer_avant_mesure
dependencies:
  compliance_policy: a_valider_pour_population_reelle_finalite_et_canaux_en_France
  channels: []
  execution_limits: a_valider_avant_activation
  activation_blockers: [offre_non_definie, territoire_non_valide, politique_absente, sources_non_habilitees, budgets_et_seuils_non_valides]
